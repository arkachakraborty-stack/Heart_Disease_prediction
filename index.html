<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1 class="title">❤️ Heart Disease Predictor</h1>

    <form id="predictionForm" class="form-grid">

        <input type="number" id="age" placeholder="Age" required>
        <input type="number" id="sex" placeholder="Sex (1=Male, 0=Female)" required>
        <input type="number" id="cp" placeholder="Chest Pain Type (0-3)" required>
        <input type="number" id="trestbps" placeholder="Resting BP" required>
        <input type="number" id="chol" placeholder="Cholesterol" required>
        <input type="number" id="fbs" placeholder="Fasting Sugar (1/0)" required>
        <input type="number" id="restecg" placeholder="Rest ECG (0-2)" required>
        <input type="number" id="thalach" placeholder="Max Heart Rate" required>
        <input type="number" id="exang" placeholder="Exercise Angina (1/0)" required>
        <input type="number" step="0.1" id="oldpeak" placeholder="Oldpeak" required>
        <input type="number" id="slope" placeholder="Slope (0-2)" required>
        <input type="number" id="ca" placeholder="Major Vessels (0-3)" required>
        <input type="number" id="thal" placeholder="Thal (1-3)" required>

        <button type="submit">Predict</button>
    </form>

    <div id="resultCard" class="result-card">
        <div id="icon" class="icon"></div>
        <div id="resultText"></div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <div id="aiBox" class="ai-box"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
